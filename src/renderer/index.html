<!doctype html>
<html data-theme="dark" data-color-scheme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="1ONE Code" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="1ONE Code" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4E5969" />
    <link rel="icon" type="image/png" href="./pwa/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa/icon-180.png" />
    <title>1ONE Code</title>
    <script>
      // Detect stale HTML/chunks before Vite's preload error handler has to recover.
      (function () {
        var buildId = '__ONE_WEBUI_BUILD_ID__';
        window.__ONE_WEBUI_BUILD_ID = buildId;
        if (!buildId || buildId.indexOf('__ONE_') === 0 || typeof fetch !== 'function') {
          return;
        }
        try {
          fetch('./webui-build.json?ts=' + Date.now(), { cache: 'no-store' })
            .then(function (response) {
              return response.ok ? response.json() : null;
            })
            .then(function (info) {
              if (!info || !info.buildId || info.buildId === buildId) {
                return;
              }
              var key = '__one_build_mismatch_recovery_at';
              var last = Number(sessionStorage.getItem(key) || '0');
              var now = Date.now();
              if (now - last < 30000) {
                return;
              }
              sessionStorage.setItem(key, String(now));
              var url = new URL(window.location.href);
              url.searchParams.set('__one_cache_bust', String(now));
              window.location.replace(url.toString());
            })
            .catch(function () {});
        } catch (e) {}
      })();

      // Recover from stale Vite chunks/CSS after WebUI rebuilds.
      window.addEventListener('vite:preloadError', function (event) {
        event.preventDefault();
        try {
          var key = '__one_preload_recovery_at';
          var last = Number(sessionStorage.getItem(key) || '0');
          var now = Date.now();
          if (now - last < 30000) {
            return;
          }
          sessionStorage.setItem(key, String(now));
          var url = new URL(window.location.href);
          url.searchParams.set('__one_cache_bust', String(Date.now()));
          window.location.replace(url.toString());
        } catch (e) {
          window.location.reload();
        }
      });

      // 同步恢复主题，防止页面闪烁
      (function () {
        try {
          var theme = localStorage.getItem('__1one_theme');
          var colorScheme = localStorage.getItem('__1one_colorScheme');
          // 兼容旧版 key（一次性迁移）
          if (!theme) {
            theme = localStorage.getItem('__aionui_theme');
            if (theme) {
              localStorage.setItem('__1one_theme', theme);
              localStorage.removeItem('__aionui_theme');
            }
          }
          if (!colorScheme) {
            colorScheme = localStorage.getItem('__aionui_colorScheme');
            if (colorScheme) {
              localStorage.setItem('__1one_colorScheme', colorScheme);
              localStorage.removeItem('__aionui_colorScheme');
            }
          }
          if (theme) document.documentElement.setAttribute('data-theme', theme);
          if (colorScheme) document.documentElement.setAttribute('data-color-scheme', colorScheme);
        } catch (e) {}
      })();
    </script>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      // 同步设置 arco-theme 和 body 背景，防止白屏闪烁
      try {
        var t = localStorage.getItem('__1one_theme');
        var cs = localStorage.getItem('__1one_colorScheme');
        var hash = window.location.hash || '';
        var useLightAuthShell =
          hash === '#/enterprise/auth' ||
          hash.indexOf('#/enterprise/auth?') === 0 ||
          hash === '#/login' ||
          hash.indexOf('#/login?') === 0;
        if (t) document.body.setAttribute('arco-theme', t);
        var BG_MAP = {
          'default':        '#0e0e0e',
          '1one-cyber':     '#050f22',
          '1one-volcanic':  '#130b05',
          '1one-forest':    '#061710',
          '1one-aurora':    '#070515',
          '1one-moonlight': '#f0f4fb',
        };
        if (useLightAuthShell) {
          document.body.style.background = '#f3f7ff';
        } else if (cs && BG_MAP[cs]) {
          document.body.style.background = BG_MAP[cs];
        } else if (t === 'dark' || !t) {
          document.body.style.background = '#0e0e0e';
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
